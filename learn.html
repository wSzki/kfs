<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f0e7">
  <title>KFS_2 — Learning workbook</title>
  <style>
    :root {
      --paper: #f4f0e7;
      --paper-light: #faf8f2;
      --ink: #202722;
      --muted: #68716a;
      --forest: #275a46;
      --forest-dark: #1d4636;
      --forest-wash: #e5ece5;
      --rule: #d6d2c8;
      --clay: #8b4d38;
      --good: #275a46;
      --bad: #8a392e;
      --code-bg: #eae8df;
      --focus: #a64b28;
      --serif: Georgia, "Palatino Linotype", Palatino, "Book Antiqua", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --measure: 70rem;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.65 var(--sans);
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    a { color: var(--forest-dark); text-underline-offset: .18em; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .skip-link {
      position: absolute; left: .75rem; top: -5rem; z-index: 100;
      padding: .65rem .9rem; color: white; background: var(--forest-dark);
    }
    .skip-link:focus { top: .75rem; }
.shell { max-width: calc(var(--measure) + 5rem); margin: 0 auto; padding: 1.4rem 2.5rem 5rem; }
.intro { max-width: 53rem; margin: 0 0 1.5rem; }
.eyebrow { margin: 0 0 .35rem; color: var(--forest); font: 700 .72rem var(--mono); letter-spacing: .12em; text-transform: uppercase; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; line-height: 1.18; }
h1 { margin: 0; max-width: 16ch; font-size: clamp(1.9rem, 4vw, 2.8rem); letter-spacing: -.035em; }
.intro-copy { max-width: 47rem; margin: .55rem 0 0; color: #414b43; font-size: .98rem; }
.notice {
  margin: 1.1rem 0; padding: .85rem 1rem; border: 1px solid #bdc6ba; background: var(--forest-wash);
  font-size: .88rem;
}
.notice.warning { border-color: #c79c86; background: #f4e8de; }
.notice strong { font-weight: 700; }
.no-script { margin: 1.5rem 0; padding: 1rem; border: 1px solid var(--clay); background: var(--paper-light); }
.layout { display: grid; grid-template-columns: minmax(13rem, 16rem) minmax(0, 1fr); gap: clamp(2rem, 4vw, 4rem); align-items: start; }
.course-nav { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow: auto; padding-right: .65rem; }
.nav-title-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .35rem .65rem; border-bottom: 1px solid var(--rule); padding-bottom: .55rem; }
.nav-title { margin: 0; font: 700 .78rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.nav-progress { color: var(--muted); font-size: .7rem; }
.progress-track { height: 3px; margin: .65rem 0 1.1rem; background: #dcd9cf; }
.progress-fill { width: 0; height: 100%; background: var(--forest); transition: width .18s ease; }
.nav-list { list-style: none; margin: 0; padding: 0; }
.nav-list li { margin: 0; }
.nav-button {
  display: grid; grid-template-columns: 2.65rem minmax(0, 1fr); gap: .45rem; width: 100%; text-align: left;
  border: 0; border-bottom: 1px solid #e1ded5; padding: .55rem .45rem; background: transparent; cursor: pointer;
}
.nav-button:hover { background: rgba(39, 90, 70, .055); }
.nav-button[aria-current="page"] { color: var(--forest-dark); background: var(--forest-wash); box-shadow: inset 3px 0 var(--forest); }
.nav-code { color: var(--muted); font: .72rem var(--mono); padding-top: .14rem; }
.nav-label { font-size: .79rem; line-height: 1.35; }
.nav-sub { display: block; margin-top: .17rem; color: var(--muted); font-size: .68rem; }
.nav-attempts { display: inline-block; color: var(--forest-dark); font: .65rem var(--mono); }
.nav-divider { margin: 1rem .35rem .45rem; color: var(--clay); font: 700 .68rem var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.nav-utility { margin-top: 1.2rem; border-top: 1px solid var(--rule); padding-top: .6rem; }
.nav-utility button { width: 100%; border: 0; padding: .46rem .45rem; color: var(--forest-dark); text-align: left; background: transparent; cursor: pointer; font-size: .8rem; }
.nav-utility button:hover { text-decoration: underline; }
.mobile-nav { display: none; }
.lesson { min-width: 0; }
.lesson-head { border-bottom: 1px solid var(--rule); padding-bottom: 1.2rem; margin-bottom: 1.6rem; }
.lesson-kicker { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin: 0 0 .5rem; color: var(--forest); font: 700 .73rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.lesson-title { margin: 0; font-size: clamp(1.9rem, 4vw, 2.75rem); letter-spacing: -.025em; }
.lesson-subtitle { max-width: 48rem; margin: .6rem 0 0; color: var(--muted); font-size: 1.03rem; }
.practice-line { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 1rem; color: var(--muted); font-size: .78rem; }
.practice-line strong { color: var(--ink); }
    .print-button, .quiet-button, .button {
      border: 1px solid #8f9b91; padding: .52rem .8rem; background: transparent; cursor: pointer;
      font-size: .82rem; line-height: 1.35;
    }
    .print-button:hover, .quiet-button:hover { background: #e9e8df; }
    .button.primary { border-color: var(--forest); color: white; background: var(--forest); }
    .button.primary:hover { background: var(--forest-dark); }
    .button:disabled { cursor: not-allowed; opacity: .5; }
    .section-block { margin: 1.6rem 0 2rem; }
    .section-block h3 { margin: 0 0 .7rem; font-size: 1.45rem; }
    .section-copy { max-width: 60ch; }
    .section-copy p:first-child { margin-top: 0; }
    .section-copy p:last-child { margin-bottom: 0; }
    .section-copy li { margin: .35rem 0; }
    .section-copy table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    .section-copy th, .section-copy td { text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); padding: .5rem .6rem; }
    code, pre { font-family: var(--mono); }
    :not(pre) > code { padding: .08em .25em; background: var(--code-bg); font-size: .88em; }
    .code-note { margin: 0 0 .35rem; color: var(--muted); font-size: .8rem; }
    .code-reference { color: var(--forest-dark); font: .73rem var(--mono); overflow-wrap: anywhere; }
    .code-sample { margin: .6rem 0 .8rem; padding: 1rem 1.1rem; overflow: auto; border-left: 3px solid var(--forest); background: var(--code-bg); color: #242a26; font-size: .82rem; line-height: 1.55; tab-size: 4; }
    .code-notes { padding-left: 1.3rem; color: #414b43; font-size: .87rem; }
    .tool-panel { margin: 2rem 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 1.2rem 0 1.4rem; }
    .tool-panel h3 { margin: 0 0 .25rem; font-size: 1.38rem; }
    .tool-meta { margin: 0 0 1rem; color: var(--muted); font-size: .77rem; font-style: italic; }
    .tool-form { display: flex; flex-wrap: wrap; align-items: end; gap: .8rem 1rem; }
    .field { display: grid; gap: .25rem; min-width: 8rem; }
    .field label { font-size: .77rem; font-weight: 650; }
    .field input, .field select, .glossary-search, .notes-area {
      border: 1px solid #a9afa7; border-radius: 0; padding: .5rem .6rem; color: var(--ink); background: var(--paper-light);
    }
    .field input { max-width: 13rem; }
    .tool-result { margin: 1rem 0 0; padding: .7rem .85rem; border-left: 3px solid var(--forest); background: #e9ebe4; font: .82rem/1.55 var(--mono); overflow-wrap: anywhere; }
    .tool-explain { margin: .65rem 0 0; color: var(--muted); font-size: .78rem; }
    .trace-table { width: 100%; max-width: 38rem; border-collapse: collapse; margin-top: 1rem; font: .77rem var(--mono); }
    .trace-table th, .trace-table td { text-align: left; border-bottom: 1px solid var(--rule); padding: .45rem .55rem; }
    .trace-table caption { text-align: left; margin-bottom: .4rem; color: var(--muted); font: .75rem var(--sans); }
    .quiz-section { margin: 2.5rem 0; padding: 1.35rem 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); }
    .quiz-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
    .quiz-title { margin: 0; font-size: 1.55rem; }
    .quiz-position { color: var(--muted); font: .75rem var(--mono); white-space: nowrap; }
    .quiz-fieldset { min-width: 0; margin: 1rem 0 0; padding: 0; border: 0; }
    .quiz-prompt { margin: 0 0 .85rem; font-size: 1.03rem; font-weight: 650; }
    .choice-list { display: grid; gap: .45rem; }
    .choice {
      display: grid; grid-template-columns: 1.2rem minmax(0, 1fr); align-items: start; gap: .7rem;
      border: 1px solid var(--rule); padding: .65rem .75rem; cursor: pointer; background: var(--paper-light);
    }
    .choice:hover { border-color: #87998d; }
    .choice input { margin: .28rem 0 0; accent-color: var(--forest); }
    .choice-copy { line-height: 1.45; }
    .choice-letter { display: inline-block; width: 1.5rem; color: var(--muted); font: .72rem var(--mono); }
    .quiz-actions { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; margin-top: 1rem; }
    .question-pager { display: flex; gap: .5rem; }
    .answer-feedback { margin-top: 1.2rem; padding: .9rem 1rem; border-left: 3px solid var(--forest); background: var(--forest-wash); }
    .answer-feedback.incorrect { border-left-color: var(--bad); background: #f3e7df; }
    .answer-feedback h4 { margin: 0 0 .5rem; font-size: 1.1rem; }
    .answer-feedback p { margin: .45rem 0; font-size: .88rem; }
    .answer-feedback .rationale { padding-top: .45rem; border-top: 1px solid rgba(32,39,34,.12); }
    .answer-feedback .rationale strong { font: 700 .7rem var(--mono); text-transform: uppercase; letter-spacing: .03em; }
    .attempt-history { margin-top: .55rem; color: var(--muted); font: .7rem var(--mono); }
    .review-banner { margin-bottom: 1.2rem; padding: .85rem 1rem; border: 1px solid #c0a088; background: #f1e7dc; }
    .review-banner h2 { margin: 0 0 .25rem; font-size: 1.2rem; }
    .review-banner p { margin: 0; font-size: .84rem; }
    .end-section { margin: 2.1rem 0; padding-top: 1.25rem; border-top: 1px solid var(--rule); }
    .end-section h3 { margin: 0 0 .65rem; font-size: 1.4rem; }
    .exercise-prompt, .solution-body { max-width: 60ch; }
    .solution-body { margin-top: .9rem; padding: .9rem 1rem; border-left: 3px solid var(--clay); background: #f1e9df; }
    .solution-body h4 { margin: 0 0 .5rem; font-size: 1.05rem; }
    .personal-label { display: block; margin: 1rem 0 .3rem; font-size: .78rem; font-weight: 700; }
    .notes-area { display: block; width: 100%; min-height: 6.2rem; resize: vertical; font: .9rem/1.5 var(--sans); }
    .defense-list, .recap-list { max-width: 60ch; padding-left: 1.35rem; }
    .defense-list li, .recap-list li { margin: .45rem 0; }
    .boundary-note { max-width: 60ch; margin: 1rem 0; padding: .7rem .9rem; border-left: 2px solid #a67e62; color: #50483f; background: #eee9de; font-size: .84rem; }
    .source-list { max-width: 64ch; padding-left: 1.15rem; }
    .source-list li { margin: .6rem 0; font-size: .83rem; }
    .source-list p { margin: .2rem 0; color: var(--muted); }
    .module-pager { display: flex; justify-content: space-between; gap: 1rem; margin: 3rem 0 0; padding-top: 1rem; border-top: 1px solid var(--rule); }
    .module-pager button { max-width: 48%; }
    .glossary-view, .review-view { min-height: 38rem; }
    .glossary-intro { max-width: 48rem; color: var(--muted); }
    .glossary-search { display: block; width: min(100%, 32rem); margin: 1.25rem 0; }
    .glossary-list { display: grid; grid-template-columns: 1fr; max-width: 55rem; }
    .glossary-entry { display: grid; grid-template-columns: minmax(9rem, .3fr) 1fr; gap: 1.2rem; border-top: 1px solid var(--rule); padding: .75rem 0; }
    .glossary-entry dt { font: 700 .88rem var(--mono); }
    .glossary-entry dd { margin: 0; max-width: 58ch; color: #414b43; font-size: .88rem; }
    .empty-state { margin: 1rem 0; padding: 1rem; border: 1px solid var(--rule); color: var(--muted); }
    dialog {
      width: min(34rem, calc(100vw - 2rem)); border: 1px solid var(--forest); padding: 1.4rem;
      color: var(--ink); background: var(--paper-light); box-shadow: 0 1rem 3rem rgba(20,30,22,.24);
    }
    dialog::backdrop { background: rgba(25,35,28,.55); }
    dialog h2 { margin: 0 0 .55rem; font-size: 1.5rem; }
    dialog p { font-size: .9rem; }
    .dialog-actions { display: flex; justify-content: end; gap: .65rem; margin-top: 1.2rem; }
    .ack-check { display: flex; align-items: start; gap: .6rem; margin: 1rem 0; font-size: .85rem; }
    .ack-check input { margin-top: .35rem; accent-color: var(--forest); }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .shell { padding: 1.2rem 1rem 3rem; }
      .intro { margin-bottom: 1.1rem; }
      .layout { display: block; }
      .course-nav { display: none; }
      .mobile-nav { display: block; margin: 0 0 1.4rem; border: 1px solid var(--rule); background: var(--paper-light); }
      .mobile-nav summary { padding: .75rem .85rem; color: var(--forest-dark); font-weight: 700; cursor: pointer; }
      .mobile-nav .nav-inside { max-height: 55vh; overflow: auto; border-top: 1px solid var(--rule); padding: .5rem .7rem .8rem; }
      .mobile-nav .nav-title-row { display: none; }
      .mobile-nav .nav-divider { margin-top: .75rem; }
      .mobile-nav .nav-utility { margin-top: .6rem; }
      .lesson-title { font-size: clamp(1.8rem, 8vw, 2.4rem); }
      .lesson-head { padding-bottom: .9rem; margin-bottom: 1.2rem; }
      .glossary-entry { grid-template-columns: 1fr; gap: .25rem; }
      .module-pager { margin-top: 2rem; }
      .quiz-actions { align-items: stretch; }
      .question-pager { width: 100%; }
      .quiz-actions > .button { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
    @page { margin: 14mm; }
    @media print {
      :root { --paper: white; --paper-light: white; --ink: #111; --muted: #444; --rule: #aaa; }
      body { background: white; font-size: 11pt; }
      .shell { max-width: none; padding: 1rem 0; }
      .intro, .course-nav, .mobile-nav, .print-button, .quiz-actions, .nav-utility, .module-pager, .solution-toggle, .glossary-search, dialog { display: none !important; }
      .layout { display: block; }
      .lesson-head { margin-bottom: 1rem; }
      .section-block, .end-section, .quiz-section, .tool-panel { break-inside: avoid; }
      .code-sample { white-space: pre-wrap; }
      a { color: #111; }
      textarea { border: 1px solid #888; min-height: 3rem; }
      .answer-feedback, .notice, .tool-result { print-color-adjust: exact; }
    }
  </style>
</head>

    "bonus": false,
    "sections": [
      {
        "title": "A hosted program has a host",
        "html": "<p>A Linux program starts after Linux has loaded it. The program can use its C library. That library can ask Linux to handle files, processes, terminal output, and other resources. KFS_2 has no Linux kernel beneath it. This code is the kernel. It must provide each operation, use a boot-protocol service, or leave the operation unsupported.</p><p>The target is 32-bit i386, even if your development computer uses another architecture. The Multiboot loader loads the kernel. Our assembly entry sets the stack. C configures the required GDT and reports stack memory. Bonus work can add a shell or keyboard support.</p>"
      },
      {
        "title": "Why copying printf is not enough",
        "html": "<p><code>printf</code> is a library function, not a CPU instruction or device. In Linux, a formatter can pass bytes to an operating-system output path. Copying its formatting code into a kernel does not add Linux system calls, a terminal driver, or a device. The code might build a text buffer with nowhere to send it.</p><p>A kernel formatter works when code connects it to real output routines. KFS_2 has <code>printk</code>. It supports a small set of formats, then sends each character to VGA text memory and COM1 serial. Formatting and sending output are separate jobs. The kernel needs both.</p>"
      },
      {
        "title": "The project boundary and the pair contract",
        "html": "<p>The required work is not a general-purpose operating system. Submit the source, Makefile, and a bootable virtual image within the subject limit of 10 MB. The project also needs the i386 GDT at <code>0x800</code> and a readable kernel-stack display. Bonus shell or keyboard work cannot replace a missing required part.</p><p>This is a pair-learning project. Either partner may be asked about any line. Divide the implementation to teach each other, then review and explain each other’s work. You do not need Linux internals, a filesystem, networking, or a scheduler to explain this kernel.</p>"
      }
    ],

      ]
    },

        "choices": [
          {
            "text": "Nothing. printf is a CPU instruction that writes text to every screen.",

            "text": "It still needs a device output path. Formatting code does not create Linux system calls or a terminal driver.",
            "why": "Correct. Formatting and sending bytes are separate jobs. KFS_2 provides its own VGA and serial paths."

        "html": "<p><code>printk</code> supports <code>%c</code>, <code>%s</code>, <code>%x</code>, <code>%d</code>, <code>%u</code>, and <code>%%</code>. It converts values to characters, then sends them through <code>console_putc</code>.</p><p>The current hex helper has a bug. <code>u32_to_hex_str</code> calls <code>hex_char(v &amp; 0xF)</code> eight times. It never shifts or consumes higher nibbles. For <code>0x2A</code>, it repeats the low nibble as <code>aaaaaaaa</code>. Its unpadded zero path trims to <code>0</code>.</p><p><code>printk_hex(value, width)</code> passes a width to the same helper. This requests padding but does not correct the conversion.</p><p>The parser does not implement every C <code>printf</code> format. It lacks <code>%p</code>, width/flag syntax such as <code>%08x</code>, and automatic type checks for variadic arguments. Each specifier must match its argument type and order. Read executable code rather than intended behavior in comments. This lesson does not repair the kernel or prove runtime output.</p>"

        "title": "Decode the selector instead of memorizing it",

        "title": "An eight-byte descriptor is a packed hardware record",
        "html": "<p>A 32-bit code/data descriptor uses eight bytes. Its fields are split across the record.</p><p>Bytes 0–1 hold limit bits 15:0. Bytes 2–3 hold base bits 15:0. Byte 4 holds base bits 23:16. Byte 5 holds access bits. Byte 6 holds flags in its high nibble and limit bits 19:16 in its low nibble. Byte 7 holds base bits 31:24.</p><p><code>set_gate</code> writes these fields into <code>gdt_entry</code>. The <code>_Static_assert</code> checks that the C types are eight and six bytes. It catches size or padding changes. It does not prove that each bit has the intended meaning.</p><p>Access values include <code>0x9A</code> for kernel code and <code>0x92</code> for writable kernel data. User code uses <code>0xFA</code>. User data uses <code>0xF2</code>. The access byte defines type and privilege attributes.</p>"

      {

        "html": "<p><code>gdt_ptr</code> is a separate packed six-byte record. It contains a 16-bit limit and a 32-bit base. The table has seven entries of eight bytes each, or 56 bytes. Its limit is the offset of the final byte: <code>56 − 1 = 55</code>. It is not a byte count or entry count. The base is <code>0x800</code>, where descriptor zero starts.</p><p>The record is a static object in the linked kernel image. The GDT table itself must be written at address <code>0x800</code>. C passes <code>(uint32_t)&amp;gp</code> to <code>gdt_flush</code>. Under cdecl, assembly reads this pointer from <code>[esp + 4]</code>, then runs <code>lgdt [eax]</code>.</p>"
      },

        "title": "LGDT and segment caches",

        "html": "<p>The bonus driver polls the 8042 status port <code>0x64</code>. When status bit 0 is set, it reads one byte from data port <code>0x60</code>. This is polling. The CPU keeps checking instead of waiting for a configured interrupt handler. Maskable interrupts remain disabled. The kernel has no IDT/PIC path for keyboard interrupts.</p><p>The byte is a scan code, not a C character or ASCII. In these set-1-style mappings, a make code commonly marks a press. A break code commonly adds bit 7 for release. <code>keyboard_getchar</code> ignores ordinary releases. It changes Shift state for the two Shift break codes. It uses <code>sc2c</code> to map the code to a character.</p>"

        "title": "Trust the table over the contradictory comment",

    function toolHTML(kind) {
      if (!kind) return '';
      if (kind === 'selector') return `<section class="tool-panel" aria-labelledby="tool-title"><h3 id="tool-title">Selector, decoded</h3><p class="tool-meta">Example addresses</p>
        <div class="tool-form"><div class="field"><label for="selector-index">Descriptor index (0–8191)</label><input id="selector-index" type="number" min="0" max="8191" step="1" value="1"></div>
        <div class="field"><label for="selector-ti">Table indicator</label><select id="selector-ti"><option value="0">GDT (0)</option><option value="1">LDT (1)</option></select></div>
        <div class="field"><label for="selector-rpl">Requested privilege (0–3)</label><input id="selector-rpl" type="number" min="0" max="3" step="1" value="0"></div></div>
        <output class="tool-result" id="selector-result" aria-live="polite"></output><p class="tool-explain">Selector = index × 8 + TI × 4 + RPL. The aligned descriptor byte offset is index × 8; TI and RPL occupy the selector's low bits and do not select a different GDT offset.</p></section>`;
      if (kind === 'endian') return `<section class="tool-panel" aria-labelledby="tool-title"><h3 id="tool-title">Bytes, then the word</h3><p class="tool-meta">Little-endian byte order</p>
        <div class="tool-form"><div class="field"><label for="endian-hex">Hex word (1–8 digits)</label><input id="endian-hex" type="text" inputmode="text" maxlength="8" value="78563412" autocomplete="off"></div></div>
        <output class="tool-result" id="endian-result" aria-live="polite"></output><p class="tool-explain">The least-significant byte sits at the lowest address.</p></section>`;
      if (kind === 'stack') return `<section class="tool-panel" aria-labelledby="tool-title"><h3 id="tool-title">A small downward-growing stack trace</h3><p class="tool-meta">Paper trace</p>
        <div class="tool-form"><div class="field"><label for="stack-top">Initial exclusive top address (hex)</label><input id="stack-top" type="text" maxlength="8" value="00101000"></div>
        <div class="field"><label for="stack-value">Value to push (hex)</label><input id="stack-value" type="text" maxlength="8" value="12345678"></div>
        <div class="field"><label for="stack-return">Call return address (hex)</label><input id="stack-return" type="text" maxlength="8" value="00001020"></div>
        <button class="button primary" id="stack-run" type="button">Trace push → call → return → pop</button></div>
        <div id="stack-result" aria-live="polite"></div><p class="tool-explain">Each 32-bit push moves ESP down by four bytes. A call also pushes a return address. A return pops that address back into instruction flow.</p></section>`;
      return '';
    }
    function questionHTML(question, questionIndex, questionCount, context) {
      const record = state.answers[question.id];
      const draft = state.drafts[question.id];
      const chosen = draft !== undefined ? draft : record?.latest?.choice;
      const attempt = record?.attempts?.length || 0;
      const feedback = record?.latest ? `<div id="answer-feedback" class="answer-feedback ${record.latest.correct ? '' : 'incorrect'}" role="status" aria-live="polite" tabindex="-1">
        <h4>${record.latest.correct ? 'Your latest answer is correct.' : 'Your latest answer is not correct yet.'}</h4>
        <p>${record.first ? `First attempt: ${record.first.correct ? 'correct' : 'incorrect'}. The first result does not change.` : ''}${record.attempts.length > 1 ? ` This is attempt ${record.attempts.length}. The first result stays in the record.` : ''}</p>
        ${question.choices.map((choice, i) => `<p class="rationale"><strong>${i === question.answer ? 'Answer' : 'Choice ' + String.fromCharCode(65 + i)}${i === question.answer ? ' · correct' : ''}</strong> — ${escapeHTML(choice.why)}</p>`).join('')}
        <p class="attempt-history">First try: ${record.first?.correct ? 'correct' : 'incorrect'} · attempts so far: ${attempt}</p></div>` : '';
      const isReview = context === 'review';
      return `<section class="quiz-section" aria-labelledby="quiz-title">
        <div class="quiz-title-row"><h3 class="quiz-title" id="quiz-title">${isReview ? 'Review question' : 'Check your model'}</h3><span class="quiz-position">${questionIndex + 1} / ${questionCount} · ${escapeHTML(question.id)}</span></div>
        <form id="quiz-form" data-question="${escapeHTML(question.id)}">
          <fieldset class="quiz-fieldset"><legend class="quiz-prompt" tabindex="-1">${escapeHTML(question.prompt)}</legend><div class="choice-list">
            ${question.choices.map((choice, i) => `<label class="choice"><input type="radio" name="answer" value="${i}" ${chosen === i ? 'checked' : ''} ${i === 0 ? 'required' : ''}><span class="choice-copy"><span class="choice-letter">${String.fromCharCode(65 + i)}.</span>${escapeHTML(choice.text)}</span></label>`).join('')}
          </div></fieldset>
          <div class="quiz-actions"><button class="button primary" id="submit-answer" type="submit">${attempt ? 'Try this question again' : 'Check my answer'}</button>${isReview ? '' : `<span class="question-pager"><button class="quiet-button" type="button" id="question-prev" ${questionIndex === 0 ? 'disabled' : ''}>Previous question</button><button class="quiet-button" type="button" id="question-next" ${questionIndex + 1 >= questionCount ? 'disabled' : ''}>Next question</button></span>`}</div>
        </form>${feedback}
      </section>`;
    }
    function endSectionsHTML(module) {
      const exercise = module.exercise || {};
      const revealed = !!state.revealedSolutions[module.id];
      const defense = (module.defense || []).map(prompt => `<li>${escapeHTML(prompt)}</li>`).join('');
      const recap = (module.recap || []).map(item => `<li>${escapeHTML(item)}</li>`).join('');
      const sources = (module.sources || []).map(source => `<li><a href="${escapeHTML(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(source.label)}</a><p>${escapeHTML(source.connection)}</p></li>`).join('');
      return `<section class="end-section" aria-labelledby="exercise-title"><h3 id="exercise-title">Work it out on paper</h3><div class="exercise-prompt">${exercise.prompt || ''}</div>
        <label class="personal-label" for="exercise-notes">My answer</label><textarea class="notes-area" id="exercise-notes" data-note-type="exercise" data-module="${escapeHTML(module.id)}" placeholder="Write your reasoning in your own words…">${escapeHTML(state.exerciseNotes[module.id] || '')}</textarea>
        <button type="button" class="quiet-button solution-toggle" id="solution-toggle" aria-expanded="${revealed}">${revealed ? 'Hide worked solution' : 'Reveal worked solution'}</button>
        ${revealed ? `<div class="solution-body" id="worked-solution"><h4>Worked reasoning</h4>${exercise.solution || ''}</div>` : ''}</section>
        <section class="end-section" aria-labelledby="defense-title"><h3 id="defense-title">Explain it to another person</h3><ol class="defense-list">${defense}</ol>
        <label class="personal-label" for="defense-notes">Defense notes</label><textarea class="notes-area" id="defense-notes" data-note-type="defense" data-module="${escapeHTML(module.id)}" placeholder="Try an explanation without reading the lesson…">${escapeHTML(state.defenseNotes[module.id] || '')}</textarea></section>
        <section class="end-section" aria-labelledby="recap-title"><h3 id="recap-title">Keep these in view</h3><ul class="recap-list">${recap}</ul>${module.boundary ? `<p class="boundary-note"><strong>Enough for this project:</strong> ${escapeHTML(module.boundary)}</p>` : ''}</section>
        <section class="end-section" aria-labelledby="sources-title"><h3 id="sources-title">Sources &amp; code connection</h3><ul class="source-list">${sources}</ul><p class="tool-explain">Compare each source claim with the repository code. A source does not prove that the kernel built or ran.</p></section>`;
    }
    function moduleHTML(module) {
      const questions = module.questions || [];
      const questionIndex = Math.min(state.activeQuestion, Math.max(0, questions.length - 1));
      const question = questions[questionIndex];
      const attempts = firstAttemptCount(module);
      return `<article class="lesson-content" data-active-module="${escapeHTML(module.id)}">
        <header class="lesson-head"><p class="lesson-kicker"><span>${escapeHTML(module.id)}</span>${module.bonus ? '<span>Optional appendix</span>' : '<span>Mandatory course</span>'}</p><h2 class="lesson-title" tabindex="-1">${escapeHTML(module.title)}</h2><p class="lesson-subtitle">${escapeHTML(module.subtitle || '')}</p>
          <div class="practice-line">${attempts ? `<span>First tries: <strong>${firstAttemptCorrect(module)}/${attempts}</strong> · retries: <strong>${retryCount(module)}</strong></span>` : ''}<button class="print-button" type="button" id="print-lesson">Print this lesson</button></div>
        </header>

        ${(module.sections || []).map(sectionHTML).join('')}
        ${codeHTML(module.code)}
        ${module.tool ? toolHTML(module.tool) : ''}
        ${question ? questionHTML(question, questionIndex, questions.length, 'lesson') : '<p class="empty-state">This module has no question content.</p>'}
        ${endSectionsHTML(module)}
        <nav class="module-pager" aria-label="Move between modules"><button class="quiet-button" type="button" id="module-prev" ${moduleIndex(module.id) <= 0 ? 'disabled' : ''}>← Previous module</button><button class="quiet-button" type="button" id="module-next" ${moduleIndex(module.id) >= COURSE.length - 1 ? 'disabled' : ''}>Next module →</button></nav>
      </article>`;
    }
    function moduleIndex(id) { return COURSE.findIndex(module => module.id === id); }
    function reviewHTML() {
      const ids = missedQuestionIds();
      if (!ids.length) return `<article class="review-view"><p class="eyebrow">Review</p><h2 class="lesson-title">Questions to revisit</h2><p class="glossary-intro">This list includes questions answered incorrectly at least once. A correct retry does not remove a question.</p><p class="empty-state">No questions answered incorrectly yet.</p></article>`;
      const index = Math.min(Number.isInteger(state.reviewIndex) ? state.reviewIndex : 0, ids.length - 1);
      const id = ids[index];
      const item = questionById.get(id);
      const question = item.question;
      return `<article class="review-view"><p class="eyebrow">Review · ${index + 1} of ${ids.length}</p><h2 class="lesson-title">Questions to revisit</h2><div class="review-banner"><h2>${escapeHTML(item.module.id)} · ${escapeHTML(item.module.title)}</h2><p>Answered incorrectly at least once. The first-attempt result stays unchanged.</p></div>
        ${questionHTML(question, index, ids.length, 'review')}
        <p class="attempt-history">Answered incorrectly at least once · latest answer: ${state.answers[id]?.latest?.correct ? 'correct' : 'incorrect'} · attempts: ${state.answers[id]?.attempts?.length || 0}.</p>
        <nav class="module-pager" aria-label="Move through review questions"><button type="button" class="quiet-button" id="review-prev" ${index === 0 ? 'disabled' : ''}>← Previous review question</button><button type="button" class="quiet-button" id="review-next" ${index + 1 >= ids.length ? 'disabled' : ''}>Next review question →</button></nav>
        <button class="quiet-button" type="button" id="return-lesson" style="margin-top:1.25rem">Return to ${escapeHTML(state.activeModule)}</button></article>`;
    }
    function glossaryHTML() {
      return `<article class="glossary-view"><p class="eyebrow">Terms, in plain language</p><h2 class="lesson-title">Glossary</h2><p class="glossary-intro">Short definitions for technical terms. Search for a term to find it in the course.</p>
        <label class="personal-label" for="glossary-search">Search terms and definitions</label><input class="glossary-search" id="glossary-search" type="search" autocomplete="off" placeholder="Try “selector” or “stack”…"><dl class="glossary-list" id="glossary-list">${glossary.map(([term, definition]) => `<div class="glossary-entry" data-glossary="${escapeHTML((term + ' ' + definition).toLowerCase())}"><dt>${escapeHTML(term)}</dt><dd>${escapeHTML(definition)}</dd></div>`).join('')}</dl><p id="glossary-empty" class="empty-state" hidden>No glossary term matches that search.</p></article>`;
    }
    function render() {
      normalizeLocation();
      renderNavs();
      const module = byId.get(state.activeModule);
      if (state.view === 'glossary') main.innerHTML = glossaryHTML();
      else if (state.view === 'review') main.innerHTML = reviewHTML();
      else if (module) main.innerHTML = moduleHTML(module);
      else main.innerHTML = '<p class="empty-state">Course content is not available.</p>';
      bindCommon();
      if (state.view === 'lesson') bindLesson(module);
      if (state.view === 'review') bindReview();
      if (state.view === 'glossary') bindGlossary();
    }
    function bindCommon() {
      $('#print-lesson')?.addEventListener('click', () => window.print());
      $('#exercise-notes')?.addEventListener('input', saveNote);
      $('#defense-notes')?.addEventListener('input', saveNote);
      $('#solution-toggle')?.addEventListener('click', () => {
        const module = byId.get(state.activeModule);
        if (!module) return;
        state.revealedSolutions[module.id] = !state.revealedSolutions[module.id];
        persist(); render();
        $('#solution-toggle')?.focus();
      });
      $('#quiz-form')?.addEventListener('change', event => {
        if (event.target.matches('input[name="answer"]')) {
          event.currentTarget.querySelector('fieldset').removeAttribute('aria-invalid');
          state.drafts[event.currentTarget.dataset.question] = Number(event.target.value);
          persist();
        }
      });
      $('#quiz-form')?.addEventListener('submit', submitAnswer);
      $('#question-prev')?.addEventListener('click', () => moveQuestion(-1));
      $('#question-next')?.addEventListener('click', () => moveQuestion(1));
    }
    function bindLesson(module) {
      $('#module-prev')?.addEventListener('click', () => moveModule(-1));
      $('#module-next')?.addEventListener('click', () => moveModule(1));
      if (module?.tool === 'selector') bindSelectorTool();
      if (module?.tool === 'endian') bindEndianTool();
      if (module?.tool === 'stack') bindStackTool();
    }
    function bindReview() {
      const ids = missedQuestionIds();
      $('#review-prev')?.addEventListener('click', () => moveReview(-1));
      $('#review-next')?.addEventListener('click', () => moveReview(1));
      $('#return-lesson')?.addEventListener('click', () => {
        state.view = 'lesson'; persist(); render(); focusAndReveal('.lesson-title');
      });
    }
    function bindGlossary() {
      $('#glossary-search')?.addEventListener('input', event => {
        const query = event.target.value.trim().toLowerCase();
        let shown = 0;
        document.querySelectorAll('.glossary-entry').forEach(entry => {
          const visible = !query || entry.dataset.glossary.includes(query);
          entry.hidden = !visible;
          if (visible) shown++;
        });
        $('#glossary-empty').hidden = shown > 0;
      });
    }
    function saveNote(event) {
      const input = event.currentTarget;
      const moduleId = input.dataset.module;
      const target = input.dataset.noteType === 'exercise' ? state.exerciseNotes : state.defenseNotes;
      target[moduleId] = input.value;
      persist();
    }
    function submitAnswer(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const questionId = form.dataset.question;
      const question = questionById.get(questionId)?.question;
      if (!question) return;
      const choice = form.querySelector('input[name="answer"]:checked');
      if (!choice) {
        form.querySelector('fieldset').setAttribute('aria-invalid', 'true');
        form.querySelector('input[name="answer"]')?.focus();
        return;
      }
      const index = Number(choice.value);
      if (!Number.isInteger(index) || index < 0 || index >= question.choices.length) return;
      const correct = index === question.answer;
      const existing = state.answers[questionId];
      const attempt = { choice: index, correct, at: new Date().toISOString() };
      if (existing) {
        existing.attempts.push(attempt);
        existing.latest = attempt;
      } else {
        state.answers[questionId] = { first: attempt, latest: attempt, attempts: [attempt] };
      }
      delete state.drafts[questionId];
      persist();
      render();
      focusAndReveal('#answer-feedback');
    }
    function moveQuestion(delta) {
      const module = byId.get(state.activeModule);
      if (!module) return;
      const next = state.activeQuestion + delta;
      if (next < 0 || next >= module.questions.length) return;
      state.activeQuestion = next;
      persist(); render();
      focusAndReveal('.quiz-prompt');
    }
    function moveModule(delta) {
      const index = moduleIndex(state.activeModule) + delta;
      if (index < 0 || index >= COURSE.length) return;
      const next = COURSE[index];
      if (next.bonus && !state.bonusAcknowledged) { selectedBonusPending = true; openBonusDialog(); return; }
      state.activeModule = next.id; state.activeQuestion = 0; state.view = 'lesson';
      persist(); render(); focusAndReveal('.lesson-title');
    }
    function moveReview(delta) {
      const ids = missedQuestionIds();
      const current = Number.isInteger(state.reviewIndex) ? state.reviewIndex : 0;
      const next = current + delta;
      if (next < 0 || next >= ids.length) return;
      state.reviewIndex = next;
      persist(); render(); focusAndReveal('.quiz-prompt');
    }
    function openBonusDialog() {
      const dialog = $('#bonus-dialog');
      $('#bonus-ack-check').checked = false;
      $('#bonus-continue').disabled = true;
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else if (window.confirm('Browser and QCM activity do not establish mandatory E/Q/P/R understanding or the artifact gate. This appendix is optional practice. Open it?')) {
        state.bonusAcknowledged = true;
        if (selectedBonusPending && bonuses.length) state.activeModule = bonuses[0].id;
        selectedBonusPending = false; state.activeQuestion = 0; state.view = 'lesson';
        persist(); render();
      }
    }
    $('#bonus-ack-check').addEventListener('change', event => { $('#bonus-continue').disabled = !event.target.checked; });
    $('#bonus-cancel').addEventListener('click', () => $('#bonus-dialog').close());
    $('#bonus-continue').addEventListener('click', () => {
      if (!$('#bonus-ack-check').checked) return;
      state.bonusAcknowledged = true;
      $('#bonus-dialog').close();
      if (selectedBonusPending && bonuses.length) state.activeModule = bonuses[0].id;
      selectedBonusPending = false; state.activeQuestion = 0; state.view = 'lesson';
      persist(); render();
      if (mobileNav.open) mobileNav.open = false;
      focusAndReveal('.lesson-title');
    });
    function exportData() {
      const output = {
        exportedAt: new Date().toISOString(),
        note: 'Workbook answers and notes.',
        activeModule: state.activeModule,
        activeQuestion: state.activeQuestion,
        answers: state.answers,
        exerciseNotes: state.exerciseNotes,
        defenseNotes: state.defenseNotes,
        revealedSolutions: state.revealedSolutions,
        bonusAcknowledged: state.bonusAcknowledged
      };
      const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url; anchor.download = 'kfs2-learning-workbook-export.json';
      document.body.append(anchor); anchor.click(); anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function resetWorkbook() {
      if (!window.confirm('Reset all answers, notes, and your current place? Export a backup first if you need one.')) return;
      state = freshState();
      try {
        localStorage.removeItem(STORAGE_KEY);
        storageAvailable = true;
        storageKind = 'available';
      } catch (error) {
        storageAvailable = false;
        storageMessage = 'This browser cannot save your notes. Export them before you close this page.';
        storageKind = 'warning';
      }
      renderStorageStatus(); render();
      if (mobileNav.open) mobileNav.open = false;
      focusAndReveal('.lesson-title');
    }
    function parseUnsignedHex(input, max) {
      const text = String(input).trim().replace(/^0x/i, '');
      if (!/^[0-9a-f]{1,8}$/i.test(text)) return null;
      const value = Number.parseInt(text, 16);
      return Number.isSafeInteger(value) && value >= 0 && value <= max ? value : null;
    }
    function bindSelectorTool() {
      const update = () => {
        const index = $('#selector-index').valueAsNumber;
        const ti = Number($('#selector-ti').value);
        const rpl = $('#selector-rpl').valueAsNumber;
        const out = $('#selector-result');
        if (!Number.isInteger(index) || index < 0 || index > 8191 || ![0,1].includes(ti) || !Number.isInteger(rpl) || rpl < 0 || rpl > 3) {
          out.textContent = 'Enter an index from 0 to 8191, TI 0 or 1, and RPL 0 to 3.'; return;
        }
        const selector = index * 8 + ti * 4 + rpl;
        out.textContent = `descriptor byte offset = ${index} × 8 = 0x${(index * 8).toString(16).padStart(4, '0')} · selector = 0x${selector.toString(16).padStart(4, '0')} (index ${index} | TI ${ti} | RPL ${rpl})`;
      };
      ['selector-index', 'selector-ti', 'selector-rpl'].forEach(id => $('#' + id).addEventListener('input', update)); update();
    }
    function bindEndianTool() {
      const input = $('#endian-hex');
      const output = $('#endian-result');
      const update = () => {
        const text = input.value.trim().replace(/^0x/i, '');
        if (!/^[0-9a-f]{1,8}$/i.test(text)) { output.textContent = 'Enter one to eight hexadecimal digits (0–FFFFFFFF).'; return; }
        const normalized = text.padStart(text.length + text.length % 2, '0');
        const bytes = normalized.match(/.{2}/g).map(pair => Number.parseInt(pair, 16));
        const memory = [...bytes].reverse();
        const ascii = memory.map(byte => byte >= 32 && byte <= 126 ? String.fromCharCode(byte) : '·').join('');
        output.textContent = `written word: 0x${text.toUpperCase()} · low address → high address: ${memory.map(byte => '0x' + byte.toString(16).padStart(2,'0').toUpperCase()).join('  ')} · printable ASCII in that order: “${ascii}”`;
      };
      input.addEventListener('input', update); update();
    }
    function bindStackTool() {
      const result = $('#stack-result');
      $('#stack-run').addEventListener('click', () => {
        const top = parseUnsignedHex($('#stack-top').value, 0xffffffff);
        const value = parseUnsignedHex($('#stack-value').value, 0xffffffff);
        const ret = parseUnsignedHex($('#stack-return').value, 0xffffffff);
        if (top === null || value === null || ret === null || top < 16) {
          result.innerHTML = '<p class="tool-result" role="alert">Use valid hexadecimal values no larger than FFFFFFFF, with the initial exclusive top at least 0x10.</p>'; return;
        }
        const esp0 = top;
        const pushAddress = esp0 - 4;
        const callAddress = pushAddress - 4;
        const espAfterReturn = callAddress + 4;
        const espAfterPop = espAfterReturn + 4;
        const rows = [
          ['Start', `0x${esp0.toString(16).padStart(8,'0').toUpperCase()}`, 'Top is exclusive; no item stored at this address yet.'],
          ['push value', `0x${pushAddress.toString(16).padStart(8,'0').toUpperCase()}`, `ESP -= 4; stores 0x${value.toString(16).padStart(8,'0').toUpperCase()}.`],
          ['call target', `0x${callAddress.toString(16).padStart(8,'0').toUpperCase()}`, `Call pushes return address 0x${ret.toString(16).padStart(8,'0').toUpperCase()}.`],
          ['ret', `0x${espAfterReturn.toString(16).padStart(8,'0').toUpperCase()}`, `Pops return address into control flow; ESP += 4.`],
          ['pop value', `0x${espAfterPop.toString(16).padStart(8,'0').toUpperCase()}`, 'Pops the earlier value; ESP returns to its starting boundary.']
        ];
        result.innerHTML = `<table class="trace-table"><caption>Stack pointer by operation (lower addresses are below)</caption><thead><tr><th scope="col">Step</th><th scope="col">ESP</th><th scope="col">What changed</th></tr></thead><tbody>${rows.map(row => `<tr><th scope="row">${escapeHTML(row[0])}</th><td>${escapeHTML(row[1])}</td><td>${escapeHTML(row[2])}</td></tr>`).join('')}</tbody></table>`;
      });
      $('#stack-run').click();
    }
    loadState();
    if (!COURSE.length) {
      main.innerHTML = '<p class="empty-state">Course modules have not been embedded.</p>';
    } else {
      render();
    }
  })();
  </script>
</body>
</html>
